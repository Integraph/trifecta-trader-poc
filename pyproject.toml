[project]
name = "trifecta-trader-poc"
version = "0.1.0"
description = "Trifecta Trader POC - Multi-agent AI trading system"
requires-python = ">=3.11"
dependencies = [
    # Core framework (also installed via TradingAgents requirements.txt)
    # LangGraph stack pinned for TRI-66 (v0.3.0 upgrade); full lockfile is TRI-65.
    "langgraph==1.0.10",
    "langchain-core==1.2.16",
    # langgraph-checkpoint-sqlite is imported at module level by v0.3.0
    # (graph/checkpointer.py) -> required for `import src.run_analysis`.
    # Pinned to the TRI-66-tested resolve (holds langgraph 1.0.10, no downgrade).
    "langgraph-checkpoint-sqlite==3.1.0",
    "langgraph-checkpoint==4.1.1",
    "langchain-openai",
    "langchain-experimental",
    "langchain-anthropic",
    "langchain-google-genai",
    # Data
    "pandas",
    # yfinance floor raised for TradingAgents v0.3.0 (dataflows rewritten vs 1.4.x API)
    "yfinance>=1.4.1",
    "stockstats>=0.6.5",
    # Infrastructure
    "redis",
    "requests",
    "tqdm",
    "pytz",
    # UI
    "streamlit",
    # Testing
    "pytest",
    "pytest-asyncio",
    # Utilities
    "python-dotenv",
    "rich",
    # Trade execution
    "alpaca-py",
    # Platform integration (Task 013)
    "supabase>=2.0.0",
    "pyyaml",
    # Pipeline automation (Task 014)
    "apscheduler>=3.10.0",
    "pytz>=2024.1",
    # Admin API (Task 016)
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest-cov",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "vendor/TradingAgents"]
asyncio_mode = "auto"
